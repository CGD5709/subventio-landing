<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="750" fill="#08090a"/>
  
  <!-- Subtle Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
    <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18e299"/>
      <stop offset="100%" stop-color="#0c8c5e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <!-- Left Sidebar Area -->
  <rect x="0" y="0" width="260" height="750" fill="#0c0d10" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Brand in sidebar -->
  <circle cx="45" cy="45" r="14" fill="url(#mintGrad)"/>
  <rect x="70" y="38" width="100" height="14" rx="4" fill="#ffffff" fill-opacity="0.9"/>
  
  <!-- Sidebar Navigation lines -->
  <rect x="25" y="90" width="210" height="34" rx="6" fill="rgba(24, 226, 153, 0.12)" stroke="rgba(24, 226, 153, 0.25)"/>
  <rect x="40" y="101" width="18" height="12" rx="3" fill="#18e299"/>
  <rect x="68" y="101" width="110" height="12" rx="3" fill="#18e299"/>

  <rect x="25" y="136" width="210" height="34" rx="6" fill="transparent"/>
  <rect x="40" y="147" width="18" height="12" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="68" y="147" width="90" height="12" rx="3" fill="rgba(255,255,255,0.4)"/>

  <rect x="25" y="182" width="210" height="34" rx="6" fill="transparent"/>
  <rect x="40" y="193" width="18" height="12" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="68" y="193" width="125" height="12" rx="3" fill="rgba(255,255,255,0.4)"/>

  <rect x="25" y="228" width="210" height="34" rx="6" fill="transparent"/>
  <rect x="40" y="239" width="18" height="12" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="68" y="239" width="80" height="12" rx="3" fill="rgba(255,255,255,0.4)"/>

  <!-- Top App Navigation -->
  <rect x="260" y="0" width="940" height="65" fill="#080808" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="290" y="18" width="280" height="30" rx="6" fill="#121212" stroke="rgba(255,255,255,0.08)"/>
  <rect x="305" y="26" width="14" height="14" rx="3" fill="rgba(255,255,255,0.3)"/>
  <rect x="328" y="27" width="120" height="12" rx="3" fill="rgba(255,255,255,0.3)"/>
  <rect x="1100" y="18" width="70" height="30" rx="6" fill="#18e299"/>

  <!-- Main Canvas Area -->
  <rect x="290" y="95" width="200" height="20" rx="4" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="290" y="125" width="350" height="14" rx="3" fill="rgba(255,255,255,0.3)"/>

  <!-- 3 Top Metric Cards -->
  <rect x="290" y="165" width="275" height="100" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
  <rect x="310" y="185" width="80" height="12" rx="3" fill="rgba(255,255,255,0.4)"/>
  <rect x="310" y="210" width="110" height="26" rx="4" fill="#18e299"/>
  <rect x="520" y="185" width="25" height="25" rx="6" fill="rgba(24, 226, 153, 0.15)"/>

  <rect x="585" y="165" width="275" height="100" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
  <rect x="605" y="185" width="90" height="12" rx="3" fill="rgba(255,255,255,0.4)"/>
  <rect x="605" y="210" width="95" height="26" rx="4" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="815" y="185" width="25" height="25" rx="6" fill="rgba(255, 255, 255, 0.1)"/>

  <rect x="880" y="165" width="290" height="100" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
  <rect x="900" y="185" width="85" height="12" rx="3" fill="rgba(255,255,255,0.4)"/>
  <rect x="900" y="210" width="120" height="26" rx="4" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="1125" y="185" width="25" height="25" rx="6" fill="rgba(255, 255, 255, 0.1)"/>

  <!-- Main Data Table / Tree Mockup -->
  <rect x="290" y="295" width="880" height="390" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
  
  <!-- Table Header -->
  <rect x="315" y="325" width="830" height="30" rx="6" fill="rgba(255,255,255,0.03)"/>
  <rect x="330" y="334" width="100" height="12" rx="3" fill="rgba(255,255,255,0.4)"/>
  <rect x="550" y="334" width="80" height="12" rx="3" fill="rgba(255,255,255,0.4)"/>
  <rect x="750" y="334" width="70" height="12" rx="3" fill="rgba(255,255,255,0.4)"/>
  <rect x="980" y="334" width="90" height="12" rx="3" fill="rgba(255,255,255,0.4)"/>

  <!-- Table Rows -->
  <g opacity="0.9">
    <rect x="315" y="375" width="830" height="42" rx="6" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.03)"/>
    <circle cx="340" cy="396" r="6" fill="#18e299"/>
    <rect x="360" y="390" width="140" height="12" rx="3" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="550" y="390" width="90" height="12" rx="3" fill="rgba(255,255,255,0.4)"/>
    <rect x="750" y="387" width="60" height="18" rx="4" fill="rgba(24, 226, 153, 0.15)"/>
    <rect x="980" y="390" width="110" height="12" rx="3" fill="#18e299"/>

    <rect x="315" y="430" width="830" height="42" rx="6" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.03)"/>
    <circle cx="340" cy="451" r="6" fill="#18e299"/>
    <rect x="360" y="445" width="160" height="12" rx="3" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="550" y="445" width="110" height="12" rx="3" fill="rgba(255,255,255,0.4)"/>
    <rect x="750" y="442" width="60" height="18" rx="4" fill="rgba(24, 226, 153, 0.15)"/>
    <rect x="980" y="445" width="95" height="12" rx="3" fill="#18e299"/>

    <rect x="315" y="485" width="830" height="42" rx="6" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.03)"/>
    <circle cx="340" cy="506" r="6" fill="#18e299"/>
    <rect x="360" y="500" width="130" height="12" rx="3" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="550" y="500" width="80" height="12" rx="3" fill="rgba(255,255,255,0.4)"/>
    <rect x="750" y="497" width="60" height="18" rx="4" fill="rgba(24, 226, 153, 0.15)"/>
    <rect x="980" y="500" width="120" height="12" rx="3" fill="#18e299"/>

    <rect x="315" y="540" width="830" height="42" rx="6" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.03)"/>
    <circle cx="340" cy="561" r="6" fill="#18e299"/>
    <rect x="360" y="555" width="175" height="12" rx="3" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="550" y="555" width="100" height="12" rx="3" fill="rgba(255,255,255,0.4)"/>
    <rect x="750" y="552" width="60" height="18" rx="4" fill="rgba(24, 226, 153, 0.15)"/>
    <rect x="980" y="555" width="85" height="12" rx="3" fill="#18e299"/>
  </g>

  <!-- Centered Elegant Placeholder Label Badge -->
  <g transform="translate(600, 640)">
    <rect x="-190" y="-18" width="380" height="36" rx="8" fill="#08090a" stroke="#18e299" stroke-width="1.5"/>
    <text x="0" y="5" fill="#18e299" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">
      CAPTURA DEL SOFTWARE (Sustituir en /public/app-preview.svg)
    </text>
  </g>
</svg>
